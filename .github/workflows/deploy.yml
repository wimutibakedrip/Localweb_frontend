name: Build Frontend and Deploy to Raspberry Pi

on:
  push:
    branches: [ "main" ] # หากในเครื่องใช้ master ให้เปลี่ยนเป็น master นะครับ

jobs:
  # งานที่ 1: ใช้เซิร์ฟเวอร์ GitHub ทำการ Build React + Tailwind
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: ดึงโค้ดล่าสุด
        uses: actions/checkout@v4

      - name: ตั้งค่า Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ติดตั้ง Library และ Build dist
        run: |
          npm install
          npm run build

      - name: เก็บโฟลเดอร์ dist ไว้ส่งต่อให้ Pi
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: ./dist

  # งานที่ 2: ให้ Raspberry Pi ดึงไฟล์ dist ไปวางใน Nginx
  deploy-to-pi:
    needs: build-frontend
    runs-on: self-hosted
    steps:
      - name: ดาวน์โหลดโฟลเดอร์ dist ที่ Build เสร็จแล้ว
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist

      - name: นำไฟล์หน้าเว็บไปวางใน Nginx
        run: |
          sudo rm -rf /var/www/wimuti-frontend/*
          sudo cp -r ./dist/* /var/www/wimuti-frontend/




