name: Build on GitHub and Deploy to Raspberry Pi

on:
  push:
    branches: [ "main" ]

jobs:
  # งานที่ 1: ใช้เครื่องเซิร์ฟเวอร์ GitHub (RAM เยอะ) ทำการ Build React
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: ดึงโค้ดล่าสุด
        uses: actions/checkout@v4

      - name: ตั้งค่า Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ติดตั้ง Library และ Build dist
        working-directory: ./wimuti-frontend # แก้ชื่อโฟลเดอร์ให้ตรงกับโปรเจกต์ของคุณ
        run: |
          npm install
          npm run build

      - name: เก็บโฟลเดอร์ dist ไว้ส่งต่อให้ Pi
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ./wimuti-frontend/dist # แก้ชื่อโฟลเดอร์ให้ตรงกับโปรเจกต์ของคุณ

  # งานที่ 2: ให้ Raspberry Pi ดึงไฟล์ dist ที่เสร็จแล้วไปใช้งาน และอัปเดต FastAPI
  deploy-to-pi:
    needs: build-frontend # รอให้งาน Build ด้านบนเสร็จก่อนถึงจะเริ่มทำ
    runs-on: self-hosted
    steps:
      - name: ดาวน์โหลดโฟลเดอร์ dist ที่ Build เสร็จแล้ว
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: ./dist

      - name: นำไฟล์หน้าเว็บไปวางใน Nginx
        run: |
          sudo rm -rf /var/www/wimuti-frontend/*
          sudo cp -r ./dist/* /var/www/wimuti-frontend
          sudo chown -R www-data:www-data /var/www/wimuti-frontend
          sudo chmod -R 755 /var/www/wimuti-frontend
          sudo sudo systemctl restart nginx



